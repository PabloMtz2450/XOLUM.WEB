name: XOLUM Home visual smoke

on:
  push:
    branches:
      - "release/xolum-home-visual-2026-08-27"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install
      - name: Assemble production candidate
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate
        if: github.ref_name != 'main'
        run: |
          python3 -m http.server 4173 --directory .xolum-prod/public > /tmp/xolum-home-server.log 2>&1 &
          echo $! > /tmp/xolum-home-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/xolum-home-server.log
          exit 1
      - name: Confirm new release is live on production
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..48}; do
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "https://xolum.com.mx/?release=${GITHUB_SHA}" || true)"
            js="$(curl -fsSL -H 'Cache-Control: no-cache' "https://xolum.com.mx/home-ui.js?release=${GITHUB_SHA}" || true)"
            if grep -q 'home-ui.js' <<<"$html" && grep -q 'quick-nav' <<<"$js"; then
              printf '%s\n' 'Production visual release detected.'
              exit 0
            fi
            sleep 5
          done
          printf '%s\n' 'ERROR: production did not expose the validated Home release.' >&2
          exit 1
      - name: Smoke desktop mobile and reduced motion
        shell: bash
        env:
          BASE_URL: ${{ github.ref_name == 'main' && 'https://xolum.com.mx' || 'http://127.0.0.1:4173' }}
        run: |
          set +e
          node tools/smoke-home-visual.mjs 2>&1 | tee smoke-home.log
          code=${PIPESTATUS[0]}
          echo "$code" > smoke-home.exit
          exit $code
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xolum-home-smoke-evidence
          path: |
            smoke-home.log
            smoke-home.exit
            /tmp/xolum-home-server.log
          if-no-files-found: warn
